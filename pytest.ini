[pytest]
testpaths = tests
# tests/e2e/browser_e2e.py is a standalone Playwright script, run separately.
norecursedirs = e2e
addopts = -q
markers =
    sqlite_only: test exercises SQLite internals (skipped when TEST_DATABASE_URL is set)
    postgres_only: test needs TEST_DATABASE_URL (a disposable PostgreSQL database)
