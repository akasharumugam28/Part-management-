# /etc/nginx/sites-available/trolley-manager
# HTTPS is required for PWA installation and service workers in production.
server {
    listen 80;
    server_name trolley.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name trolley.example.com;

    # e.g. issued by certbot
    ssl_certificate     /etc/letsencrypt/live/trolley.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/trolley.example.com/privkey.pem;

    # Must be >= MAX_REQUEST_MB in .env
    client_max_body_size 200m;

    location /static/ {
        alias /opt/trolley-manager/static/;
        expires 7d;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
